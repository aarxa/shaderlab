name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shaderlab
          POSTGRES_PASSWORD: shaderlab
          POSTGRES_DB: shaderlab
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shaderlab" --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://shaderlab:shaderlab@localhost:5432/shaderlab
      - run: npm run build
