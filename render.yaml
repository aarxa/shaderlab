# Render Blueprint: the app (built from the Dockerfile) plus a managed Postgres.
# Render injects PORT; the server reads it. The free web service sleeps after ~15 min idle
# (first request then takes ~30-60 s), and free Postgres instances expire after 30 days.
services:
  - type: web
    name: shaderlab
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shaderlab-db
          property: connectionString
      # The free plan gets a fraction of one CPU; one full core handled ~1,000 editors (docs/M5_EXPLAINED.md).
      - key: MAX_CONNECTIONS
        value: "100"
      # Protects GET /metrics; Render generates a random value (visible in the dashboard).
      - key: METRICS_TOKEN
        generateValue: true

databases:
  - name: shaderlab-db
    plan: free
    databaseName: shaderlab
    user: shaderlab
