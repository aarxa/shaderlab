# Render Blueprint: the app (built from the Dockerfile) plus a managed Postgres.
# Render injects PORT; the server reads it. The free web service sleeps after ~15 min idle
# (first request then takes ~30-60 s), and free Postgres instances expire after 30 days.
services:
  - type: web
    name: shaderlab
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shaderlab-db
          property: connectionString

databases:
  - name: shaderlab-db
    plan: free
    databaseName: shaderlab
    user: shaderlab
